<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet the community</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-gray-900 text-gray-100 antialiased">
    <main class="mx-auto max-w-6xl px-6 py-16 sm:px-8">
      <header class="mb-10 text-center">
        <p
          class="mb-3 text-sm font-semibold uppercase tracking-widest text-indigo-300"
        >
          Our community
        </p>
        <h1 class="text-4xl font-bold tracking-tight text-white sm:text-5xl">
          Meet the people
        </h1>
        <p class="mx-auto mt-4 max-w-xl text-gray-400">
          Get to know some of the wonderful people in our community.
        </p>
      </header>

      <section
        id="community"
        class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
        aria-label="Community members"
        aria-live="polite"
      >
        <p class="col-span-full rounded-xl border border-gray-700 bg-gray-800 p-6 text-center text-gray-300">
          Loading community members…
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
